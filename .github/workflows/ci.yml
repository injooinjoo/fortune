name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check edge pricing SoT sync
        run: |
          if ! npm run check:edge-pricing; then
            echo "::error::Edge pricing drift detected — supabase/functions/_shared/fortune-pricing-generated.ts is not in sync with packages/product-contracts/src/fortune-pricing.ts. Run 'pnpm sync:edge-pricing' and commit the generated file."
            exit 1
          fi

  mobile-rn-typecheck:
    name: mobile-rn typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile-rn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.1 --activate
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: tsc --noEmit
        run: npm run typecheck

  web-typecheck-build:
    name: web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check web design token sync
        run: |
          if ! npm run check:web-tokens; then
            echo "::error::Design token drift detected — apps/web/src/styles/tokens.css is not in sync with packages/design-tokens/src/index.ts. Run 'pnpm sync:web-tokens' and commit the generated file."
            exit 1
          fi

      - name: tsc --noEmit
        run: pnpm --filter @fortune/web typecheck

      # apps/web 의 테스트 파일은 저장소에 있는데 실행되는 곳이 없었다.
      # typecheck 는 타입만 보고 Playwright 는 브라우저 동작만 본다 — 잔액
      # 정규화, 분석 이벤트 화이트리스트, 스냅샷 차단 키 같은 순수 로직은
      # 게이트 없이 master 로 들어가고 있었다. build 앞에 둬서 빨리 실패하게 한다.
      - name: Web unit tests
        run: node scripts/run-web-unit-tests.mjs

      - name: next build
        run: pnpm --filter @fortune/web build

      # playwright.web.config.js 의 webServer 가 build && start 를 다시 돌린다
      # (reuseExistingServer: true 라 이미 떠 있으면 재사용). 포트 3100 — 루트
      # playwright.config.js 의 RN web export(3000) 와 충돌하지 않는다.
      # chromium-headless-shell 을 명시적으로 받는다.
      # 로컬(macOS)에서 `npx playwright install chromium` 은 chromium-1217 만 설치하고
      # chrome-headless-shell 을 빠뜨려 "Executable doesn't exist at
      # .../chromium_headless_shell-1217" 로 3/4 스펙이 실패했다. 리눅스 러너에서도
      # 같은지는 확인하지 못했지만(기존 e2e-tests.yml:54 는 chromium 만 받고도 동작 중),
      # 두 개를 명시하는 것은 idempotent 하고 부작용이 없으므로 방어적으로 지정한다.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # NEXT_PUBLIC_SITE_URL 은 여기서 덮어쓰지 않는다. 이 값은 `lib/env.ts` 의
      # `siteUrl` 이고 canonical/og 메타데이터의 출처라, localhost 로 바꾸면
      # public-domain.spec.js 의 canonical 계약(zpzg.co.kr)이 깨진다. 브라우저가
      # 어디로 접속할지는 playwright.web.config.js 의 baseURL 이 이미 정한다.
      - name: Web smoke (Playwright)
        run: npm run test:web:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: playwright-report/web
          retention-days: 7

  rls-static-audit:
    name: Supabase RLS static audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static RLS audit
        run: bash supabase/scripts/rls-static-audit.sh
