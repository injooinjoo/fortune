name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check edge pricing SoT sync
        run: |
          if ! npm run check:edge-pricing; then
            echo "::error::Edge pricing drift detected — supabase/functions/_shared/fortune-pricing-generated.ts is not in sync with packages/product-contracts/src/fortune-pricing.ts. Run 'pnpm sync:edge-pricing' and commit the generated file."
            exit 1
          fi

  mobile-rn-typecheck:
    name: mobile-rn typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile-rn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.1 --activate
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: tsc --noEmit
        run: npm run typecheck

  rls-static-audit:
    name: Supabase RLS static audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static RLS audit
        run: bash supabase/scripts/rls-static-audit.sh
